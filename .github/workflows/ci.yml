name: CI

# Typecheck, test and build. A failing step is documented by LokErrorReport's CI reporter:
# annotations on the changed files, a job summary, and a crash-report artifact.
# It never commits and never opens issues.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @lok/error-report exec tsx scripts/ci-report.ts --step typecheck --out "$GITHUB_WORKSPACE/crash-report-typecheck.md" -- pnpm -C ../.. run typecheck
      - name: Test (game)
        run: pnpm --filter @lok/error-report exec tsx scripts/ci-report.ts --step test --out "$GITHUB_WORKSPACE/crash-report-test.md" -- pnpm -C ../../artifacts/survivor-616 test
      - name: Test (error report)
        run: pnpm --filter @lok/error-report exec tsx scripts/ci-report.ts --step error-report-test --out "$GITHUB_WORKSPACE/crash-report-error-report-test.md" -- pnpm -C ../.. --filter @lok/error-report test
      - name: Build
        run: pnpm --filter @lok/error-report exec tsx scripts/ci-report.ts --step build --out "$GITHUB_WORKSPACE/crash-report-build.md" -- pnpm -C ../../artifacts/survivor-616 build

      - name: Upload crash report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lok-crash-report
          path: crash-report-*.md
          if-no-files-found: ignore
