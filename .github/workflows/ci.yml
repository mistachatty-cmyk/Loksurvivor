name: CI

# Typecheck, build and run every test for the game on each pull request and each push to main.
# The build runs before the tests on purpose: src/buildPrivacy.test.ts inspects the finished
# build (no source maps, no readable dev phrase, no debug hooks) and skips itself without one.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: artifacts/survivor-616
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        env:
          PORT: '3000'
          BASE_PATH: /
        run: pnpm exec vite build --config vite.config.ts

      - name: Tests
        run: pnpm test

      - name: Install browser for smoke tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Map and music smoke tests (dark maps are visible, songs switch cleanly)
        run: pnpm exec playwright test e2e/dark-maps-visible.spec.ts e2e/music-rapid-switch.spec.ts

      # Speed budgets (limits are ~3-4x what a laptop measures, so only a real slowdown trips them).
      - name: Simulation speed budget
        run: |
          pnpm exec tsx scripts/bench-sim.ts 20 normal monroe-strip --max-avg 2.5 --max-p99 25
          pnpm exec tsx scripts/bench-sim.ts 20 million monroe-strip --max-avg 10 --max-p99 40
          pnpm exec tsx scripts/bench-sim.ts 20 normal abyssal-subway-4x --max-avg 2.5 --max-p99 25
          pnpm exec tsx scripts/bench-sim.ts 20 normal endless-catacombs --max-avg 2.5 --max-p99 25
