name: Auto-translate locales

# Translates new and changed strings in the game's English file into every
# language listed in artifacts/survivor-616/l10n.config.json, then commits the
# result back to the branch. Free: no API keys. The package that does the work
# lives in packages/auto-l10n (see its README for how it behaves and its limits).
#
# Only English is ever edited by hand. A push that changes it, or the config,
# runs this. The commit this job makes touches neither, so it cannot loop.
on:
  push:
    paths:
      - 'artifacts/survivor-616/src/locales/en.json'
      - 'artifacts/survivor-616/l10n.config.json'
  workflow_dispatch:
    inputs:
      engine:
        description: 'Override the engine: google, argos or google,argos (blank = use the config)'
        required: false
        default: ''
  # Google may rate limit a first run part way through. This finishes the job
  # later; when nothing is missing it does nothing and commits nothing.
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: auto-l10n
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    # Google first (best wording); when it rate limits the runner, Argos takes over
    # so a first run finishes in one go. Later runs only send new or changed strings.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Only the translator package and its one dependency; skips the rest of the workspace.
      - run: pnpm install --frozen-lockfile --filter @lok/auto-l10n

      # Argos Translate: the unlimited fallback engine. Free, runs on the runner, no key.
      # CPU-only torch keeps the install small; models (~100 MB per language) are cached.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/pip
          key: argos-${{ runner.os }}-v1

      - name: Install Argos Translate
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install argostranslate

      - name: Check the package
        run: pnpm --filter @lok/auto-l10n test

      - name: Translate new and changed strings
        env:
          ENGINE: ${{ inputs.engine }}
        run: node packages/auto-l10n/bin/auto-translate.js sync --config artifacts/survivor-616/l10n.config.json ${ENGINE:+--engine "$ENGINE"}

      - name: Commit translated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(l10n): auto-translate new strings'
          file_pattern: 'artifacts/survivor-616/src/locales/*.json artifacts/survivor-616/src/locales/.l10n-lock.json'
