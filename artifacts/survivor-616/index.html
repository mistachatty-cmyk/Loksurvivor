    <style>
      /* Critical baseline, inline on purpose: if the built stylesheet fails to
         load (flaky network, a cold CDN edge), the app previously fell back to
         the browser's default white serif document with every decorative
         element rendered raw. This keeps the shell dark, sans-serif and
         scroll-locked no matter what, and hides purely decorative layers. */
      html, body { margin: 0; background: #0a0a0b; color: #e7e7ea; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      #root { min-height: 100dvh; }
      [aria-hidden="true"] { pointer-events: none; }
    </style>
