# Auto-translate locale files whenever the English source changes.
#
# Drop this file into .github/workflows/ (or run `npx @lok/auto-l10n init`).
# No API keys or secrets are needed: translation uses the free Google Translate
# web endpoint through @vitalets/google-translate-api.
#
# Edit the paths below if your locale folder is not ./locales.
name: Auto-translate locales

on:
  push:
    paths:
      - 'locales/en.json'
  workflow_dispatch:
  # Google may rate limit a first run part way through. This finishes the job
  # later; when nothing is missing it does nothing and commits nothing.
  schedule:
    - cron: '17 */6 * * *'

# One run at a time, so two quick pushes never fight over the same files.
concurrency:
  group: auto-l10n
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    # Google first (best wording); when it rate limits the runner, Argos takes over
    # so a first run finishes in one go. Later runs only send new or changed strings.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Argos Translate: the unlimited fallback engine. Free, runs on the runner, no key.
      # CPU-only torch keeps the install small; models (~100 MB per language) are cached.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/pip
          key: argos-${{ runner.os }}-v1

      - name: Install Argos Translate
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install argostranslate

      - name: Translate new and changed strings
        run: npx --yes @lok/auto-l10n sync

      - name: Commit translated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(l10n): auto-translate new strings'
          file_pattern: 'locales/*.json locales/.l10n-lock.json'
